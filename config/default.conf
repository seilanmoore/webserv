http {
  server {
      listen 8080;

      client_max_body_size 10485760;

      error_page 400 /errors/400.html;
      error_page 403 /errors/403.html;
      error_page 404 /errors/404.html;
      error_page 405 /errors/405.html;
      error_page 500 /errors/500.html;
      error_page 502 /errors/502.html;
      error_page 504 /errors/504.html;

      root ./docs/html;

      index index.html index.htm;

      location / {
          limit_except GET POST;
          autoindex on;
          index index.html index.htm;
      }

      location /static {
          limit_except GET;
          root ./docs/html;
          autoindex off;
      }

      location /upload {
          limit_except POST DELETE;
          upload_store ./uploads;
          upload_enable on;
      }

      location /files {
          limit_except GET;
          root ./uploads;
          autoindex on;
      }

      location /cgi-bin {
          limit_except GET POST;
          root ./cgi-bin;
          cgi_pass .py /usr/bin/python3;
          cgi_pass .sh /bin/bash;
          cgi_pass .pl /usr/bin/perl;
          cgi_pass .rb /usr/bin/ruby;
          cgi_pass .php /usr/bin/php;
          cgi_enable on;
      }

      location /old-page {
          return 301 /index.html;
      }

      location /about {
          limit_except GET;
          root ./docs/html;
          index about.html;
      }
  }

  server {
      listen 8081;

      client_max_body_size 5242880;

      error_page 404 /errors/404.html;
      error_page 500 /errors/500.html;

      root ./docs/html;
      index about.html;

      location / {
          limit_except GET POST PUT DELETE;
          autoindex on;
          index about.html;
      }

      location /scripts {
          limit_except GET POST;
          root ./cgi-bin;
          cgi_pass .py /usr/bin/python3;
          cgi_enable on;
      }
  }
}
