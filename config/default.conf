# Default Configuration File for WebServ HTTP Server
# =================================================
http {
  # Server 1: Main website on port 8080
  server {
      # Interface and port configuration
      listen 8080;

      # Maximum client body size (in bytes)
      # 10MB = 10485760 bytes
      client_max_body_size 10485760;

      # Default error pages
      error_page 400 /errors/400.html;
      error_page 403 /errors/403.html;
      error_page 404 /errors/404.html;
      error_page 405 /errors/405.html;
      error_page 500 /errors/500.html;
      error_page 502 /errors/502.html;
      error_page 504 /errors/504.html;

      # Root directory for this server
      root ./docs/html;

      # Default index files
      index index.html index.htm;

      # Route 1: Root location
      location / {
          # Accepted HTTP methods
          limit_except GET POST;
          
          # Enable directory listing
          autoindex on;
          
          # Default file when accessing a directory
          index index.html index.htm;
      }

      # Route 2: Static files (restricted methods)
      location /static {
          limit_except GET;
          root ./docs/html;
          autoindex off;
      }

      # Route 3: Upload endpoint
      location /upload {
          # Allow POST and DELETE for file operations
          limit_except POST DELETE;
          
          # Upload directory
          upload_store ./uploads;
          
          # Enable file uploads
          upload_enable on;
      }

      # Route 3b: Download uploaded files
      location /files {
          limit_except GET;
          root ./uploads;
          autoindex on;
      }

      # Route 4: CGI execution for multiple script types
      location /cgi-bin {
          limit_except GET POST;
          
          # CGI root directory
          root ./cgi-bin;
          
          # CGI configuration for multiple script types
          cgi_pass .py /usr/bin/python3;
          cgi_pass .sh /bin/bash;
          cgi_pass .pl /usr/bin/perl;
          cgi_pass .rb /usr/bin/ruby;
          cgi_pass .php /usr/bin/php;
          
          # Enable CGI execution
          cgi_enable on;
      }

      # Route 5: Redirection example
      location /old-page {
          # HTTP redirection (301 = permanent, 302 = temporary)
          return 301 /index.html;
      }

      # Route 6: About page
      location /about {
          limit_except GET;
          root ./docs/html;
          index about.html;
      }

      location /makelele {
          limit_except GET;
          root ./docs/html;
          index makelele.html;
      }
  }

  # Server 2: Secondary website on port 8081
  server {
      listen 8081;

      # Different max body size for this server
      client_max_body_size 5242880; # 5MB

      # Error pages
      error_page 404 /errors/404.html;
      error_page 500 /errors/500.html;

      root ./docs/html;
      index index.html;

      # Root location with different configuration
      location / {
          limit_except GET POST PUT DELETE;
          autoindex on;
          index index.html;
      }

      # API endpoint
      location /api {
          limit_except GET POST PUT DELETE;
          root ./api;
          autoindex off;
      }

      # CGI for multiple extensions
      location /scripts {
          limit_except GET POST;
          root ./cgi-bin;
          
          # Python CGI
          cgi_pass .py /usr/bin/python3;
          
          # PHP CGI (if available)
          cgi_pass .php /usr/bin/php-cgi;
          
          cgi_enable on;
      }
  }

  # Server 3: Additional server on different interface
  server {
      listen 8082;

      client_max_body_size 20971520; # 20MB

      root ./docs/html;
      index index.html;

      # Simple GET-only server
      location / {
          limit_except GET;
          autoindex on;
      }

      # File download area
      location /downloads {
          limit_except GET;
          root ./downloads;
          autoindex on;
      }
  }
}

# Configuration Notes:
# ====================
# 
# Interface:Port Configuration:
#   - Use "listen" directive with format: interface:port
#   - 0.0.0.0 means all interfaces, 127.0.0.1 for localhost only
#
# Error Pages:
#   - Use "error_page" directive: error_page <code> <path>
#   - Path is relative to server root
#
# Client Body Size:
#   - Use "client_max_body_size" in bytes
#   - Examples: 1MB = 1048576, 10MB = 10485760, 100MB = 104857600
#
# HTTP Methods:
#   - Use "limit_except" directive with space-separated methods
#   - Valid: GET, POST, PUT, DELETE, HEAD, OPTIONS, PATCH
#
# Redirections:
#   - Use "return" directive: return <code> <url>
#   - Codes: 301 (permanent), 302 (temporary), 307, 308
#
# Root Directory:
#   - Use "root" directive to set base directory for file search
#   - Can be set at server level or location level
#
# Directory Listing:
#   - Use "autoindex on" to enable, "autoindex off" to disable
#
# Default Files:
#   - Use "index" directive with space-separated filenames
#
# File Uploads:
#   - Use "upload_enable on" to enable uploads
#   - Use "upload_store" to set storage directory
#
# CGI Execution:
#   - Use "cgi_enable on" to enable CGI
#   - Use "cgi_pass" directive: cgi_pass <extension> <interpreter_path>
#   - CGI will receive proper environment variables (REQUEST_METHOD, 
#     QUERY_STRING, CONTENT_TYPE, CONTENT_LENGTH, PATH_INFO, etc.)
