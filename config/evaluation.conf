# Configuration File for Testing All Required Features
# ====================================================
# Tests:
# 1. Multiple servers with different ports (8080, 8081, 8082)
# 2. Multiple servers with different hostnames (server_name)
# 3. Custom error pages (404)
# 4. Client body limit
# 5. Routes to different directories
# 6. Default file for directories
# 7. Accepted methods for routes

http {
    # =================================================================
    # SERVER 1: Main server on port 8080
    # Hostname: localhost
    # =================================================================
    server {
        listen 8080;
        server_name localhost;

        # Maximum client body size: 1KB (for testing body limit)
        client_max_body_size 1024;

        # Custom error pages
        error_page 404 /errors/404.html;
        error_page 405 /errors/405.html;
        error_page 500 /errors/500.html;

        # Root directory
        root ./docs/html;

        # Default index files
        index index.html;

        # Route 1: Root location - GET and POST only
        location / {
            limit_except GET POST;
            autoindex on;
            index index.html;
        }

        # Route 2: Static files - GET only (no DELETE allowed)
        location /static {
            limit_except GET;
            root ./docs/html;
            autoindex off;
        }

        # Route 3: Upload location - POST and DELETE allowed
        location /upload {
            limit_except POST DELETE;
            upload_store ./uploads;
            upload_enable on;
        }

        # Route 4: Limited body endpoint - only 100 bytes allowed
        location /limited {
            limit_except POST;
            client_max_body_size 100;
        }

        # Route 5: Test directory with custom index
        location /testdir {
            limit_except GET;
            root ./test_dir;
            index custom_index.html;
            autoindex on;
        }

        # Route 6: DELETE allowed route
        location /deletable {
            limit_except GET DELETE;
            root ./uploads;
            upload_enable on;
        }
    }

    # =================================================================
    # SERVER 2: Second server on port 8081
    # Hostname: test.local
    # =================================================================
    server {
        listen 8081;
        server_name test.local;

        # Different max body size: 500 bytes
        client_max_body_size 500;

        # Custom error pages
        error_page 404 /errors/404.html;
        error_page 405 /errors/405.html;

        root ./docs/html;
        index index.html;

        # Root location - all methods allowed
        location / {
            limit_except GET POST PUT DELETE;
            autoindex on;
            index index.html;
        }

        # CGI location
        location /cgi-bin {
            limit_except GET POST;
            root ./cgi-bin;
            cgi_pass .py /usr/bin/python3;
            cgi_pass .sh /bin/bash;
            cgi_enable on;
        }
    }

    # =================================================================
    # SERVER 3: Third server on port 8082
    # Hostname: example.com (for testing --resolve)
    # =================================================================
    server {
        listen 8082;
        server_name example.com www.example.com;

        client_max_body_size 2048;

        error_page 404 /errors/404.html;

        root ./docs/html;
        index about.html;

        # Root location - GET only
        location / {
            limit_except GET;
            autoindex on;
            index about.html;
        }
    }

    # =================================================================
    # SERVER 4: Fourth server on port 8083 (different port)
    # Hostname: alternate.local
    # =================================================================
    server {
        listen 8083;
        server_name alternate.local;

        client_max_body_size 2048;

        error_page 404 /errors/404.html;

        root ./YoupiBanane;
        index youpi.bad_extension;

        # Root location
        location / {
            limit_except GET POST;
            autoindex on;
            index youpi.bad_extension;
        }
    }
}
