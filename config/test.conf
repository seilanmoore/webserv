# Test Configuration File for WebServ HTTP Server
# =================================================
# Requirements:
# - / must answer to GET request ONLY
# - any file with .bla as extension must answer to POST request by calling cgi_tester
# - /post_body must answer anything to POST request with a maxBody of 100
# - /directory/ must answer to GET request with root YoupiBanane and default file youpi.bad_extension

http {
    server {
        listen 8080;

        # Root directory
        root ./docs/html;

        # Default error pages
        error_page 404 /errors/404.html;
        error_page 405 /errors/405.html;
        error_page 500 /errors/500.html;

        # Route 1: Root location - GET only
        location / {
            limit_except GET;
            autoindex on;
            index test.html;
            cgi_pass .bla ./cgi-bin/cgi_tester;
            cgi_enable on;
        }

        # Route 2: /post_body - POST with maxBody of 100 bytes
        location /post_body {
            limit_except POST;
            client_max_body_size 100;
        }

        # Route 3: /directory/ - GET request, root is YoupiBanane
        # Default file is youpi.bad_extension
        location /directory {
            limit_except GET POST;
            root ./YoupiBanane;
            autoindex off;
            index youpi.bad_extension;
            cgi_pass .bla /home/smoore-a/git/webserv/cgi-bin/cgi_tester;
            cgi_enable on;
            client_max_body_size 200000000;
        }
    }
}
