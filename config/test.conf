# Test Configuration File for WebServ HTTP Server
# =================================================
# Requirements:
# - / must answer to GET request ONLY
# - /put_test/* must answer to PUT request and save files to a directory
# - any file with .bla as extension must answer to POST request by calling cgi_test
# - /post_body must answer anything to POST request with a maxBody of 100
# - /directory/ must answer to GET request with root YoupiBanane and default file youpi.bad_extension

http {
    server {
        listen 8080;

        # Root directory
        root ./docs/html;

        # Default error pages
        error_page 404 /errors/404.html;
        error_page 405 /errors/405.html;
        error_page 500 /errors/500.html;

        # Route 1: Root location - GET only
        location / {
            limit_except GET;
            autoindex on;
            index index.html;
            # CGI for .bla files (any .bla file must respond to POST with CGI)
            cgi_pass .bla ./cgi-bin/cgi_test;
            cgi_enable on;
        }

        # Route 2: PUT test - save files to uploads/put_test directory
        location /put_test {
            limit_except PUT;
            upload_store ./uploads/put_test;
            upload_enable on;
        }

        # Route 4: /post_body - POST with maxBody of 100 bytes
        location /post_body {
            limit_except POST;
            client_max_body_size 100;
        }

        # Route 5: /directory/ - GET for browsing, POST for .bla CGI
        # "/directory/" answers GET, ".bla files" answer POST via CGI
        location /directory {
            limit_except GET POST;
            root ./YoupiBanane;
            autoindex off;
            index youpi.bad_extension;
            cgi_pass .bla ./cgi-bin/cgi_test;
            cgi_enable on;
            client_max_body_size 200000000;
        }
    }
}
