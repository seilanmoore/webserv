# --- Configuración Global ---
# Estas directivas se aplican a todos los servidores si no se anulan.

# Establece el tamaño máximo del cuerpo de una petición de cliente (ej: 10 megabytes)
client_max_body_size 10m;

# Páginas de error por defecto
error_page 404 /errors/404.html;
error_page 403 /errors/403.html;
error_page 500 /errors/500.html;


# --- Servidor 1: Sitio Web Principal (example.com) ---
server {
    # Escucha en el puerto 80 en todas las interfaces (IPv4 e IPv6)
    listen 80;
    listen [::]:80;

    # Nombre(s) del servidor (para coincidencia de host)
    server_name example.com www.example.com;

    # Directorio raíz para este servidor
    root /var/www/example_com;

    # Archivos índice por defecto al solicitar un directorio
    index index.html index.htm;

    # --- Ubicación por defecto (para /) ---
    location / {
        # Métodos HTTP permitidos para esta ruta
        allow_methods GET HEAD;
        
        # Desactivar el listado de directorios
        autoindex off;
    }

    # --- Ubicación para PHP-CGI ---
    # Maneja cualquier archivo que termine en .php
    location / { 
        # Si la ruta es un directorio, busca primero index.php
        index index.php index.html;

        # Configuración de CGI
        # Mapea la extensión .php al ejecutable de php-cgi
        cgi .php /usr/bin/php-cgi;
    }

    # --- Ubicación para redirección ---
    location /old-blog {
        # Redirección permanente (301)
        return 301 /new-blog;
    }

    # --- Ubicación para subidas ---
    location /upload {
        # Solo permitir POST para subir archivos
        allow_methods POST;

        # Habilitar subidas
        upload_enable on;

        # Dónde guardar los archivos subidos
        upload_path /var/www/uploads;

        # Sobrescribir el tamaño máximo solo para esta ruta (ej: 50 megabytes)
        client_max_body_size 50m;
    }
}


# --- Servidor 2: Sitio Interno (admin.local) ---
server {
    # Escucha solo en localhost (127.0.0.1) en el puerto 8080
    listen 127.0.0.1:8080;
    
    server_name admin.local;

    # Página de error personalizada solo para este servidor
    error_page 404 /custom_404.html;

    # --- Ubicación para / (raíz) ---
    location / {
        root /var/www/admin_panel;
        allow_methods GET POST;
        autoindex on; # Permitir listado de directorios aquí
        index index.py; # El índice por defecto es un script de Python

        # Configuración de CGI
        cgi .py /usr/bin/python3;
    }

    # --- Ubicación para archivos estáticos ---
    location /static/ {
        root /var/www/static_assets;
        allow_methods GET HEAD;
        autoindex off;
    }
}
